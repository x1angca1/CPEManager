name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: build-release.bat

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${GITHUB_SHA::10}"
          gh release create "build-${GITHUB_RUN_NUMBER}" CPEManager.exe CpeContractRate.dll index.html acceleration-ui.js parameters-ui.js \
            --title "Build ${GITHUB_RUN_NUMBER} (${sha})" \
            --notes "Automated build from commit ${sha}."
