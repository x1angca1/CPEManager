name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: build-release.bat

      - name: Unit tests
        shell: cmd
        run: |
          cl /nologo /utf-8 /std:c++17 /EHsc /I . tests\ControlMessageParsingTest.cpp /Fe:tests\ControlMessageParsingTest.exe || exit /b 1
          tests\ControlMessageParsingTest.exe || exit /b 1
          cl /nologo /utf-8 /std:c++17 /EHsc /I . tests\CpeProtocolAccelerationTest.cpp /Fe:tests\AccelerationTest.exe || exit /b 1
          tests\AccelerationTest.exe || exit /b 1
          cl /nologo /utf-8 /std:c++17 /EHsc /I . tests\CpeProtocolClearLockTest.cpp /Fe:tests\ClearLockTest.exe || exit /b 1
          tests\ClearLockTest.exe || exit /b 1
          cl /nologo /utf-8 /std:c++17 /EHsc /I . tests\CpeProtocolSmsTest.cpp /Fe:tests\SmsTest.exe || exit /b 1
          tests\SmsTest.exe || exit /b 1
          cl /nologo /utf-8 /std:c++17 /EHsc /I . tests\SccParsingTest.cpp /Fe:tests\SccParsingTest.exe || exit /b 1
          tests\SccParsingTest.exe || exit /b 1

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${GITHUB_SHA::10}"
          gh release create "build-${GITHUB_RUN_NUMBER}" CPEManager.exe CpeContractRate.dll index.html acceleration-ui.js parameters-ui.js \
            --title "Build ${GITHUB_RUN_NUMBER} (${sha})" \
            --notes "Automated build from commit ${sha}."
