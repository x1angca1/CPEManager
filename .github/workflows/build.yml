name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: build-release.bat

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CPEManager-win-x64
          path: |
            CPEManager.exe
            CpeContractRate.dll
          if-no-files-found: error
